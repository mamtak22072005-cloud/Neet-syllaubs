kind = "web"
previewPath = "/"
title = "NEET Syllabus Tracker"
version = "1.0.0"
id = "artifacts/neet-tracker"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 22351
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/neet-tracker run dev"

[services.env]
PORT = "22351"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/neet-tracker", "run", "build"]
publicDir = "artifacts/neet-tracker/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
